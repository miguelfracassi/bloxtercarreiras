<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Candidaturas</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #fff;
  --fg: #0a0a0a;
  --fg2: #6b6b6b;
  --line: #e6e6e6;
  --soft: #f6f6f6;
  --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.55; min-height: 100vh; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
[hidden] { display: none !important; }
.logo-img { height: 28px; width: auto; filter: invert(1); }
svg.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 999px; padding: 11px 24px; font-weight: 600; font-size: 14px;
  background: var(--fg); color: var(--bg); border: 1.5px solid var(--fg);
  transition: transform .15s, opacity .15s, background .15s; white-space: nowrap;
}
.btn:hover { opacity: .86; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { background: var(--soft); border-color: var(--fg2); opacity: 1; }
.btn.lg { padding: 16px 38px; font-size: 16px; }
.btn.block { width: 100%; }

/* menu */
.nav {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px clamp(16px, 4vw, 40px); background: rgba(255,255,255,.88);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent;
}
.nav.scrolled { border-bottom-color: var(--line); }
.nav .acoes { display: flex; gap: 8px; align-items: center; }
.nav .tag { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); margin-left: 12px; }
@media (max-width: 520px) { .nav .tag { display: none; } .nav .btn { padding: 9px 18px; } }

/* hero */
.hero { position: relative; padding: clamp(56px, 11vw, 140px) clamp(16px, 4vw, 40px) clamp(48px, 8vw, 96px); max-width: 1240px; margin: 0 auto; }
.selo {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font-size: 13px; font-weight: 500; margin-bottom: 28px;
}
.selo i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); animation: pulso 1.8s infinite; }
@keyframes pulso { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.7); } }
.hero h1 {
  font-size: clamp(46px, 10.5vw, 132px); font-weight: 700; line-height: .98; letter-spacing: -.045em; max-width: 14ch;
}
.hero h1 em { font-style: normal; position: relative; white-space: nowrap; }
.hero h1 em::after {
  content: ''; position: absolute; left: -2%; right: -2%; bottom: .06em; height: .2em; background: var(--fg); z-index: -1; opacity: .12;
  transform-origin: left; animation: tracar 1s .5s both cubic-bezier(.2,.8,.2,1);
}
@keyframes tracar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.hero p.lead { max-width: 52ch; margin-top: 30px; font-size: clamp(16px, 2vw, 20px); color: var(--fg2); }
.hero .cta { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; }
.hero .simbolo { position: absolute; right: clamp(0px, 4vw, 60px); top: clamp(40px, 8vw, 110px); width: clamp(120px, 22vw, 300px); opacity: .06; filter: invert(1); pointer-events: none; animation: flutuar 7s ease-in-out infinite; }
@keyframes flutuar { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
.sobe { animation: sobe .8s both cubic-bezier(.2,.8,.2,1); }
.sobe.d1 { animation-delay: .08s; } .sobe.d2 { animation-delay: .16s; } .sobe.d3 { animation-delay: .24s; } .sobe.d4 { animation-delay: .32s; }
@keyframes sobe { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* faixa rolando */
.faixa { border-block: 1px solid var(--line); overflow: hidden; padding: 16px 0; background: var(--bg); }
.faixa .trilho { display: flex; gap: 48px; width: max-content; animation: rolar 32s linear infinite; font-size: clamp(18px, 3vw, 28px); font-weight: 600; letter-spacing: -.02em; }
.faixa span { display: inline-flex; align-items: center; gap: 48px; white-space: nowrap; }
.faixa span::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--fg); }
@keyframes rolar { to { transform: translateX(-50%); } }

/* seções */
.sec { max-width: 1240px; margin: 0 auto; padding: clamp(56px, 9vw, 110px) clamp(16px, 4vw, 40px); }
.sec h2 { font-size: clamp(30px, 5.5vw, 56px); font-weight: 700; letter-spacing: -.035em; line-height: 1.05; max-width: 18ch; }
.sec .sub { color: var(--fg2); margin-top: 16px; max-width: 54ch; }
.areas { margin-top: 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.area-card { border: 1.5px solid var(--line); border-radius: 24px; padding: 28px; transition: transform .2s, border-color .2s, background .2s; display: flex; flex-direction: column; gap: 14px; }
.area-card:hover { transform: translateY(-4px); border-color: var(--fg); }
.area-card .ico { width: 52px; height: 52px; border-radius: 16px; background: var(--soft); display: grid; place-items: center; }
.area-card h3 { font-size: 19px; letter-spacing: -.02em; }
.area-card p { font-size: 14px; color: var(--fg2); }
.passos { margin-top: 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; counter-reset: p; }
.passo { border-radius: 24px; background: var(--soft); padding: 28px; counter-increment: p; }
.passo::before { content: counter(p, decimal-leading-zero); font-size: 44px; font-weight: 700; letter-spacing: -.04em; display: block; line-height: 1; margin-bottom: 18px; }
.passo h3 { font-size: 18px; margin-bottom: 6px; }
.passo p { font-size: 14px; color: var(--fg2); }
.banda { background: var(--fg); color: var(--bg); text-align: center; padding: clamp(56px, 9vw, 110px) 20px; }
.banda h2 { margin: 0 auto; max-width: 16ch; font-size: clamp(32px, 6vw, 64px); font-weight: 700; letter-spacing: -.04em; line-height: 1.02; }
.banda p { color: #aaa; margin: 18px auto 34px; max-width: 46ch; }
.banda .btn { background: var(--bg); color: var(--fg); border-color: var(--bg); }
.foot { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 26px 20px; color: var(--fg2); font-size: 13px; text-align: center; }

/* cartão (login / mensagens) */
.centro { min-height: calc(100vh - 70px); display: grid; place-items: center; padding: 24px 16px 60px; }
.card { width: 100%; max-width: 420px; border: 1.5px solid var(--line); border-radius: 28px; padding: 36px 30px; background: var(--bg); box-shadow: 0 24px 60px -30px rgba(0,0,0,.18); }
.card h1, .card h2 { font-size: 28px; letter-spacing: -.03em; line-height: 1.1; }
.card .sub { color: var(--fg2); margin: 8px 0 24px; font-size: 14px; }

/* campos */
.campo { margin-bottom: 18px; }
.campo > label, .campo > .rotulo { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.campo .opc { font-weight: 400; color: var(--fg2); font-size: 12px; margin-left: 6px; }
.campo input[type=text], .campo input[type=email], .campo input[type=password], .campo input[type=tel], .campo input[type=date], .campo input[type=time], .campo textarea, .campo select {
  width: 100%; background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 16px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.campo input:focus, .campo textarea:focus, .campo select:focus { border-color: var(--fg); box-shadow: 0 0 0 4px rgba(0,0,0,.06); }
.campo textarea { resize: vertical; min-height: 110px; }
.campo.erro input, .campo.erro textarea, .campo.erro select { border-color: #111; box-shadow: 0 0 0 4px rgba(0,0,0,.1); }
.campo .msg { font-size: 12.5px; font-weight: 600; margin-top: 6px; display: none; }
.campo.erro .msg { display: block; }
.dica { font-size: 12.5px; color: var(--fg2); margin-top: 6px; }
.grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .grade2 { grid-template-columns: 1fr; gap: 0; } }
.aviso { border: 1.5px solid var(--fg); border-radius: 14px; padding: 11px 14px; font-size: 13.5px; margin-bottom: 16px; }
.aviso:empty { display: none; }
.armadilha { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* opções (radio/checkbox em cartão) */
.opcoes { display: grid; gap: 10px; }
.opcoes.linha { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opt { position: relative; display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 16px; cursor: pointer; transition: border-color .15s, background .15s; font-size: 15px; }
.opt:hover { border-color: var(--fg2); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .marca { width: 20px; height: 20px; border: 1.5px solid var(--fg2); border-radius: 50%; flex: none; display: grid; place-items: center; transition: .15s; }
.opt.check .marca { border-radius: 6px; }
.opt .marca::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); transform: scale(0); transition: transform .15s; }
.opt.check .marca::after { width: 10px; height: 6px; border-radius: 0; background: none; border-left: 2px solid var(--bg); border-bottom: 2px solid var(--bg); transform: rotate(-45deg) scale(0) translate(1px, -1px); }
.opt:has(input:checked) { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.opt:has(input:checked) .marca { border-color: var(--bg); background: var(--bg); }
.opt:has(input:checked) .marca::after { background: var(--fg); transform: scale(1); }
.opt.check:has(input:checked) .marca::after { background: none; border-color: var(--fg); transform: rotate(-45deg) scale(1) translate(1px, -1px); }
.opt:has(input:focus-visible) { outline: 2px solid var(--fg); outline-offset: 3px; }
.turno { margin-bottom: 10px; }
.turno .horas { display: none; gap: 10px; align-items: center; padding: 10px 4px 0 8px; font-size: 14px; color: var(--fg2); flex-wrap: wrap; }
.turno.on .horas { display: flex; }
.turno .horas input { width: auto; padding: 9px 12px; border-radius: 12px; }

/* formulário (inscrições) */
.wrap-form { max-width: 720px; margin: 0 auto; padding: 24px 16px 90px; }
.progresso { margin-bottom: 28px; }
.progresso .topo { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--fg2); margin-bottom: 10px; }
.progresso .barra { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.progresso .barra i { display: block; height: 100%; background: var(--fg); border-radius: 99px; width: 0; transition: width .4s cubic-bezier(.2,.8,.2,1); }
.painel-form { border: 1.5px solid var(--line); border-radius: 28px; padding: clamp(24px, 5vw, 44px); background: var(--bg); animation: sobe .5s both cubic-bezier(.2,.8,.2,1); }
.painel-form h1 { font-size: clamp(28px, 5vw, 40px); letter-spacing: -.035em; line-height: 1.05; margin-bottom: 8px; }
.painel-form .sub { color: var(--fg2); margin-bottom: 28px; }
.termos { border: 1.5px solid var(--line); border-radius: 18px; padding: 20px 22px; background: var(--soft); max-height: 340px; overflow: auto; margin-bottom: 20px; font-size: 14.5px; }
.termos ol { padding-left: 20px; display: grid; gap: 12px; }
.termos strong { font-weight: 600; }
.acoes-form { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
.acoes-form .btn { flex: 1 1 140px; }
.previa { position: relative; display: inline-block; margin-top: 12px; }
.previa img { max-height: 220px; border-radius: 16px; border: 1.5px solid var(--line); }
.previa button { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.arquivo { display: flex; align-items: center; gap: 12px; border: 1.5px dashed var(--fg2); border-radius: 16px; padding: 18px; cursor: pointer; font-size: 14px; color: var(--fg2); transition: .15s; }
.arquivo:hover { border-color: var(--fg); color: var(--fg); background: var(--soft); }
.arquivo input { display: none; }
.sucesso { text-align: center; padding: 20px 6px; }
.sucesso .selo-ok { width: 84px; height: 84px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; margin: 0 auto 24px; animation: pop .6s both cubic-bezier(.2,1.4,.4,1); }
.sucesso .selo-ok svg { width: 40px; height: 40px; stroke-width: 2.4; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.sucesso h2 { font-size: clamp(24px, 4vw, 32px); letter-spacing: -.03em; line-height: 1.15; }

/* modal */
.fundo { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--bg); border-radius: 26px; width: 100%; max-width: 640px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; animation: sobe .3s both cubic-bezier(.2,.8,.2,1); }
.modal header { padding: 24px 28px 8px; }
.modal header h2 { font-size: 24px; letter-spacing: -.03em; }
.modal header p { color: var(--fg2); font-size: 14px; margin-top: 4px; }
.modal .corpo { padding: 12px 28px; overflow: auto; }
.modal footer { display: flex; gap: 10px; padding: 18px 28px 24px; border-top: 1px solid var(--line); }
.modal footer .btn { flex: 1; }
.resp { padding: 12px 0; border-bottom: 1px solid var(--line); }
.resp:last-child { border-bottom: 0; }
.resp dt { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--fg2); margin-bottom: 3px; }
.resp dd { font-size: 15px; white-space: pre-wrap; word-break: break-word; }
.resp dd img { margin-top: 8px; max-height: 240px; border-radius: 14px; border: 1px solid var(--line); }
.sec-tit { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 18px 0 2px; padding-top: 10px; }

/* candidaturas */
.cand { max-width: 1180px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px) 80px; }
.cand h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -.04em; line-height: 1.05; }
.cand .topo { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.blocos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 30px; }
@media (max-width: 860px) { .blocos { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 440px) { .blocos { grid-template-columns: 1fr; } }
.bloco { border: 1.5px solid var(--line); border-radius: 22px; padding: 22px; min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; transition: transform .2s, border-color .2s; }
.bloco:hover { transform: translateY(-3px); border-color: var(--fg); }
.bloco.preto { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.bloco .rot { font-size: 13px; font-weight: 500; opacity: .65; }
.bloco .num { font-size: clamp(38px, 6vw, 56px); font-weight: 700; letter-spacing: -.05em; line-height: 1; }
.bloco .num.txt { font-size: clamp(20px, 2.6vw, 26px); letter-spacing: -.03em; line-height: 1.15; }
.bloco .peq { font-size: 13px; opacity: .65; margin-top: 6px; font-weight: 400; letter-spacing: 0; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 500; transition: .15s; }
.chip:hover { border-color: var(--fg2); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.busca { flex: 1 1 220px; max-width: 320px; margin-left: auto; border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 16px; outline: none; font-size: 14px; }
.busca:focus { border-color: var(--fg); }
.lista { border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; }
.linha-c { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 14px; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; transition: background .12s; }
.linha-c:last-child { border-bottom: 0; }
.linha-c:hover { background: var(--soft); }
.linha-c b { font-weight: 600; display: block; }
.linha-c small { color: var(--fg2); font-size: 12.5px; }
.pill { display: inline-block; border: 1.5px solid var(--fg); border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
@media (max-width: 680px) { .linha-c { grid-template-columns: 1fr auto; } .linha-c .hide-m { display: none; } }
.vazio { text-align: center; color: var(--fg2); padding: 54px 20px; }

/* 404 */
.nf { text-align: center; padding: 18vh 20px; }
.nf h1 { font-size: clamp(80px, 22vw, 220px); letter-spacing: -.06em; line-height: .9; }
.nf p { color: var(--fg2); margin: 14px 0 28px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<header class="nav">
  <div style="display:flex;align-items:center">
    <img class="logo-img" src="logo.png" alt="Bloxter" />
    <span class="tag">Candidaturas</span>
  </div>
  <nav class="acoes"><button class="btn ghost" id="sair" type="button" hidden>Sair</button></nav>
</header>

<!-- senha -->
<main class="centro" id="porta" hidden>
  <form class="card sobe" id="f-senha" novalidate>
    <h1>Área restrita</h1>
    <p class="sub">Digite a senha para continuar.</p>
    <div class="aviso" id="erro" role="alert"></div>
    <div class="campo"><label for="senha">Senha</label><input type="password" id="senha" autocomplete="off" inputmode="numeric" /></div>
    <button class="btn block lg" id="entrar" type="submit">Entrar</button>
  </form>
</main>

<!-- painel -->
<main class="cand" id="painel" hidden>
  <div class="topo">
    <div><h1>Candidaturas</h1><p style="color:var(--fg2)" id="atualizado"></p></div>
    <button class="btn ghost" id="recarregar" type="button">Atualizar</button>
  </div>

  <section class="blocos" aria-label="Resumo">
    <div class="bloco preto"><span class="rot">Bloco 1 · Total de inscrições</span><span class="num" id="b1">0</span></div>
    <div class="bloco"><span class="rot">Bloco 2 · Hoje</span><span class="num" id="b2">0</span></div>
    <div class="bloco"><span class="rot">Bloco 3 · Últimos 7 dias</span><span class="num" id="b3">0</span></div>
    <div class="bloco"><span class="rot">Bloco 4 · Área mais procurada</span><div class="num txt" id="b4">—</div></div>
  </section>

  <div class="filtros">
    <div id="chips" style="display:contents"></div>
    <input class="busca" id="busca" type="search" placeholder="Buscar por nome, e-mail, Discord..." autocomplete="off" />
  </div>

  <div class="lista" id="lista"></div>
</main>

<!-- detalhe -->
<div class="fundo" id="detalhe" hidden role="dialog" aria-modal="true" aria-labelledby="d-tit">
  <div class="modal">
    <header><h2 id="d-tit"></h2><p id="d-sub"></p></header>
    <div class="corpo"><dl id="d-corpo"></dl></div>
    <footer><button class="btn" type="button" id="d-fechar">Fechar</button></footer>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/candidaturas.js"></script>
</body>
</html>
